interface:
  display_name: "TITI V3–V7 micro·역렌더"
  short_description: "V3 기본 잠금문결·V3–V7 FNa98 micro·무손실 역렌더"
  default_prompt: "$clone-titi로 작업해줘. 새 잠금문이 V3이거나 Version을 지정하지 않았고 다른 문장 기준이 없으면 D5 8H → D4 10H → D6 5H 기본 캘리브레이션을 쓰되, 현재 Target 값은 현재 Source에서만 결속해 FNa98 micro 미세슬롯을 설계해줘. 승인 원문을 역렌더링할 때는 기본 캘리브레이션을 적용하지 말고 원문 바이트를 그대로 보존해줘."
